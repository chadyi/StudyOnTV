<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img"
     aria-label="StudyOnTV 工作流程：家长在手机端设定题目范围与观看时长，孩子在电视上完成学习任务后解锁观看时长，时间用完自动锁定">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="0.55" stop-color="#111013"/>
      <stop offset="1" stop-color="#141110"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#FFB020" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A2B"/>
      <stop offset="1" stop-color="#FFC24A"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A1F"/>
      <stop offset="1" stop-color="#FF9A4D"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2481B"/>
      <stop offset="1" stop-color="#FF7A3D"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" fill-opacity=".16"/>
    </pattern>
    <marker id="loopArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#6B6B74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#dots)" opacity=".55"/>
  <rect width="1600" height="700" fill="url(#glow1)"/>
  <rect width="1600" height="700" fill="url(#glow2)"/>

  <!-- 标题 -->
  <text x="120" y="104" font-size="38" font-weight="800" fill="#F2F2F4" letter-spacing="0.5">它是怎么工作的</text>
  <text x="120" y="146" font-size="20" fill="#9A9AA2">家长用手机定好规则，孩子在电视上完成任务，剩下的交给应用自动执行</text>

  <g>
    <!-- 卡片 -->
    <rect x="120" y="205" width="310" height="344" rx="28"
          fill="#141416" stroke="rgba(255,255,255,.10)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- 顶部彩色条 -->
    <path d="M148,205 H402 A28,28 0 0 1 430,233 V239 H120 V233 A28,28 0 0 1 148,205 Z" fill="url(#bar0)"/>

    <!-- 步骤序号 -->
    <circle cx="160" cy="279" r="21" fill="#1C1C21"/>
    <text x="160" y="287" text-anchor="middle" font-size="21" font-weight="700" fill="#FFC24A">1</text>

    <!-- 图标 -->
    <circle cx="275" cy="331" r="56" fill="#FFC24A" opacity=".16"/>
    <circle cx="275" cy="331" r="56" fill="none" stroke="#FFC24A" stroke-opacity=".28" stroke-width="1.5"/>
    <g fill="none" stroke="#FFC24A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(249 331)">
        <rect x="4" y="-30" width="44" height="60" rx="9"/>
        <line x1="14" y1="-14" x2="38" y2="-14"/>
        <circle cx="24" cy="-14" r="4.5" fill="#FFC24A" stroke="none"/>
        <line x1="14" y1="2" x2="38" y2="2"/>
        <circle cx="32" cy="2" r="4.5" fill="#FFC24A" stroke="none"/>
        <line x1="14" y1="18" x2="38" y2="18"/>
        <circle cx="20" cy="18" r="4.5" fill="#FFC24A" stroke="none"/>
      </g>

    <!-- 标题 -->
    <text x="275" y="427" text-anchor="middle" font-size="26" font-weight="700" fill="#F2F2F4">家长先定规则</text>
    <!-- 说明 -->
    <text x="275" y="467" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">在手机上选好题目范围、</text>
      <text x="275" y="497" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">每日时长和可用时段</text>
  </g>

  <g>
    <!-- 卡片 -->
    <rect x="470" y="205" width="310" height="344" rx="28"
          fill="#141416" stroke="rgba(255,255,255,.10)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- 顶部彩色条 -->
    <path d="M498,205 H752 A28,28 0 0 1 780,233 V239 H470 V233 A28,28 0 0 1 498,205 Z" fill="url(#bar1)"/>

    <!-- 步骤序号 -->
    <circle cx="510" cy="279" r="21" fill="#1C1C21"/>
    <text x="510" y="287" text-anchor="middle" font-size="21" font-weight="700" fill="#FF9A2B">2</text>

    <!-- 图标 -->
    <circle cx="625" cy="331" r="56" fill="#FF9A2B" opacity=".16"/>
    <circle cx="625" cy="331" r="56" fill="none" stroke="#FF9A2B" stroke-opacity=".28" stroke-width="1.5"/>
    <g fill="none" stroke="#FF9A2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(599 331)">
        <rect x="6" y="-30" width="40" height="60" rx="10"/>
        <polyline points="16,-12 21,-7 30,-18"/>
        <line x1="16" y1="6" x2="36" y2="6"/>
        <line x1="16" y1="20" x2="30" y2="20"/>
      </g>

    <!-- 标题 -->
    <text x="625" y="427" text-anchor="middle" font-size="26" font-weight="700" fill="#F2F2F4">孩子完成学习任务</text>
    <!-- 说明 -->
    <text x="625" y="467" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">电视上用遥控器作答，</text>
      <text x="625" y="497" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">题目按年龄段和科目匹配</text>
  </g>

  <g>
    <!-- 卡片 -->
    <rect x="820" y="205" width="310" height="344" rx="28"
          fill="#141416" stroke="rgba(255,255,255,.10)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- 顶部彩色条 -->
    <path d="M848,205 H1102 A28,28 0 0 1 1130,233 V239 H820 V233 A28,28 0 0 1 848,205 Z" fill="url(#bar2)"/>

    <!-- 步骤序号 -->
    <circle cx="860" cy="279" r="21" fill="#1C1C21"/>
    <text x="860" y="287" text-anchor="middle" font-size="21" font-weight="700" fill="#FF6A1F">3</text>

    <!-- 图标 -->
    <circle cx="975" cy="331" r="56" fill="#FF6A1F" opacity=".16"/>
    <circle cx="975" cy="331" r="56" fill="none" stroke="#FF6A1F" stroke-opacity=".28" stroke-width="1.5"/>
    <g fill="none" stroke="#FF6A1F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(949 331)">
        <circle cx="26" cy="0" r="26"/>
        <path d="M21,-11 L37,0 L21,11 Z" fill="#FF6A1F" stroke="none"/>
      </g>

    <!-- 标题 -->
    <text x="975" y="427" text-anchor="middle" font-size="26" font-weight="700" fill="#F2F2F4">解锁对应观看时长</text>
    <!-- 说明 -->
    <text x="975" y="467" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">完成任务后自动解锁，</text>
      <text x="975" y="497" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">这次能看多久事先就清楚</text>
  </g>

  <g>
    <!-- 卡片 -->
    <rect x="1170" y="205" width="310" height="344" rx="28"
          fill="#141416" stroke="rgba(255,255,255,.10)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- 顶部彩色条 -->
    <path d="M1198,205 H1452 A28,28 0 0 1 1480,233 V239 H1170 V233 A28,28 0 0 1 1198,205 Z" fill="url(#bar3)"/>

    <!-- 步骤序号 -->
    <circle cx="1210" cy="279" r="21" fill="#1C1C21"/>
    <text x="1210" y="287" text-anchor="middle" font-size="21" font-weight="700" fill="#E2481B">4</text>

    <!-- 图标 -->
    <circle cx="1325" cy="331" r="56" fill="#E2481B" opacity=".16"/>
    <circle cx="1325" cy="331" r="56" fill="none" stroke="#E2481B" stroke-opacity=".28" stroke-width="1.5"/>
    <g fill="none" stroke="#E2481B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(1299 331)">
        <rect x="8" y="-4" width="36" height="32" rx="8"/>
        <path d="M16,-4 v-8 a10,10 0 0 1 20,0 v8"/>
        <circle cx="26" cy="12" r="3.4" fill="#E2481B" stroke="none"/>
      </g>

    <!-- 标题 -->
    <text x="1325" y="427" text-anchor="middle" font-size="26" font-weight="700" fill="#F2F2F4">时间到自动锁定</text>
    <!-- 说明 -->
    <text x="1325" y="467" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">家长随时查看学习情况</text>
      <text x="1325" y="497" text-anchor="middle" font-size="19" fill="#9A9AA2" font-weight="400">和真实的观看时长</text>
  </g>

  <g stroke="#B8C7E6" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="436" y1="377" x2="456" y2="377" stroke-dasharray="2 8"/>
    <polyline points="454,370 464,377 454,384" stroke-dasharray="none"/>
  </g>
  <g stroke="#B8C7E6" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="786" y1="377" x2="806" y2="377" stroke-dasharray="2 8"/>
    <polyline points="804,370 814,377 804,384" stroke-dasharray="none"/>
  </g>
  <g stroke="#B8C7E6" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="1136" y1="377" x2="1156" y2="377" stroke-dasharray="2 8"/>
    <polyline points="1154,370 1164,377 1154,384" stroke-dasharray="none"/>
  </g>

  <!-- 回环箭头 -->
  <path d="M1325,549 V613 H625 V563"
        fill="none" stroke="#5A5A62" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#loopArrow)"/>
  <rect x="785" y="592" width="380" height="42" rx="21" fill="#17171B" stroke="rgba(255,255,255,.12)"/>
  <text x="975" y="620" text-anchor="middle" font-size="18" font-weight="600" fill="#D2D2D8">时间用完还想看？再完成一组学习任务</text>
</svg>
